name: Tern build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beads-tern-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Install checksum-verified Beads 1.3.2
        run: node scripts/install-ci-bd.mjs
      - name: Exercise built bridge with isolated real Beads
        run: npm run smoke
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.mjs
      - name: Package Tern only
        if: runner.os == 'Linux'
        run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: beads-tern
          if-no-files-found: error
          retention-days: 14
          path: |
            release/beads-tern-*.tar.gz
            release/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: beads-tern
          path: release
      - name: Verify published archive
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish Tern archive and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "release/beads-tern-${GITHUB_REF_NAME#v}.tar.gz" release/SHA256SUMS --verify-tag --generate-notes --title "Beads for Tern $GITHUB_REF_NAME"
